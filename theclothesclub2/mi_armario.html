<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi armario</title>
    <style>
header {
    min-height: 180px;
    position: relative;
    text-align: center;
    padding: 30px 20px 20px;
    overflow: hidden;
    background-color:#CDEBFC;
    border-bottom: 2px solid rgb(41, 19, 5);
}

.logo {
             font-family:script;
             font-size: 55px;
             font-weight: bold;
             letter-spacing: 3px;
             color:rgb(41, 19, 5);
             position: relative;
             display: inline-block;
             text-align:center;
             animation: brilloTexto 2s infinite alternate ease-in-out;
}
@keyframes brilloTexto {
    0%, 100% {
        text-shadow:#8AAFD4, 
            0 0 5px #8AAFD4,
            0 0 10px #8AAFD4,
            0 0 20px #8AAFD4;
    }
    50% {
        text-shadow: 
            0 0 15px #8AAFD4,
            0 0 25px #8AAFD4,
            0 0 40px #8AAFD4,
            0 0 50px #8AAFD4;
    }
}

.subtitle {
    font-size: 20px;

    font-style: italic;

    color: #EDABBE;
}

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: white;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        /* Imagen de fondo fijada a pantalla completa */
        .imagen-fondo-fijada {
            position: fixed;  
            top: 0;
            left: 0;
            width: 100vw;      
            height: 100vh;        
            object-fit: cover; 
            object-position: center;
            z-index: -1;       
            pointer-events: none; 
        }

        /* Contenedor principal al 100% de ancho */
        .page {
            width: 100%;
            margin: 0;
            padding: 0;
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empuja el footer bien abajo */
        }

        /* Pie de página abarcando todo el ancho horizontal */
        footer {
            width: 100%;
            text-align: center;
            padding: 18px;
            background-color: rgb(41, 19, 5);
            color: rgb(252, 249, 239);
            border-top: 2px solid rgb(54, 25, 7);
        }

        footer a {
            color:#CDEBFC;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            color:rgb(150,94,34);
        }

        .copyright {
            margin-top: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <img src="fondo2.jpg" class="imagen-fondo-fijada" alt="Fondo">
<header>

<div class="logo">
     MI ARMARIO
 </div>
</header>
<div class="armario-contenedor">
    <!-- El fondo es el interior del armario -->
    <div class="interior-armario"></div>
    
    <!-- Puerta izquierda -->
    <div class="puerta puerta-izquierda"></div>
    
    <!-- Puerta derecha -->
    <div class="puerta puerta-derecha"></div>
</div>

    <div class="page">
        
        <footer>
            <div>
                <a href="index.html">inicio</a> |
                <a href="#">mi armario</a> |
                <a href="#">outfits</a> |

                <a href="#">comunidad</a> |
                <a href="#">mi perfil</a> |
                <a href="#">ayuda</a> |
                <a href="#">contacto</a>
            </div>

            <div class="copyright">
                © 2000-2005 THE CLOTHES CLUB - todos los derechos reservados
            </div>
        </footer>
    </div>

</body>
</html>
